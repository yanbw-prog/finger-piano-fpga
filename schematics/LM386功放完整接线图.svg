<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#101820}.title{font-size:34px;font-weight:bold}.head{font-size:27px;font-weight:bold}.lab{font-size:24px}.small{font-size:20px}.wire{stroke:#111;stroke-width:4;fill:none}.signal{stroke:#1269b0;stroke-width:5;fill:none}.vcc{stroke:#c52d2f;stroke-width:5;fill:none}.part{fill:#fff;stroke:#111;stroke-width:4}.ground{stroke:#111;stroke-width:4;fill:none}.hint{fill:#fff7db;stroke:#b87800;stroke-width:2}</style>
<rect width="1800" height="1100" fill="white"/>
<text x="900" y="55" text-anchor="middle" class="title">第三部分功放：FPGA P90 → LM386 → 扬声器</text>
<text x="900" y="92" text-anchor="middle" class="lab">断电接线；FPGA、模拟电路、LM386必须共地</text>
<rect x="55" y="145" width="450" height="450" rx="15" fill="#f1f8ff" stroke="#1269b0" stroke-width="3"/><text x="85" y="190" class="head">① 输入与音量</text>
<text x="95" y="265" class="lab">FPGA P90（audio_out）</text><circle cx="335" cy="257" r="7" fill="#1269b0"/><path d="M342 257 H375" class="signal"/>
<line x1="375" y1="218" x2="375" y2="296" class="wire"/><line x1="400" y1="218" x2="400" y2="296" class="wire"/><text x="387" y="202" text-anchor="middle" class="lab">C1：100 nF</text><text x="387" y="328" text-anchor="middle" class="small">串联隔直</text><path d="M400 257 H450" class="signal"/>
<rect x="340" y="380" width="115" height="118" class="part"/><text x="397" y="425" text-anchor="middle" class="lab">P1</text><text x="397" y="460" text-anchor="middle" class="lab">100 kΩ</text><path d="M450 257 V380" class="signal"/><path d="M455 438 H485 V535" class="wire"/><path d="M397 498 V550 H505" class="signal"/><text x="405" y="580" text-anchor="middle" class="small">中间脚 → LM386 3脚</text><path d="M455 535 H515 M465 550 H505 M477 565 H493" class="ground"/><text x="520" y="548" class="small">GND</text><text x="85" y="565" class="small">P1两个外脚：一个接C1，另一个接GND</text>
<rect x="575" y="145" width="590" height="610" rx="15" fill="#fafafa" stroke="#111" stroke-width="3"/><text x="605" y="190" class="head">② LM386芯片接线</text><text x="870" y="225" text-anchor="middle" class="small">缺口朝上</text><path d="M850 235 Q870 255 890 235" class="wire"/><rect x="735" y="255" width="270" height="360" rx="8" class="part"/><text x="870" y="410" text-anchor="middle" class="title">LM386</text>
<path d="M675 300 H735 M675 365 H735 M675 430 H735 M675 495 H735" class="wire"/><text x="635" y="307" class="lab">1 悬空</text><text x="635" y="372" class="lab">2 → GND</text><text x="635" y="437" class="lab">3 ← P1中间脚</text><text x="635" y="502" class="lab">4 → GND</text>
<path d="M1005 300 H1065 M1005 365 H1065 M1005 430 H1065 M1005 495 H1065" class="wire"/><text x="1075" y="307" class="lab">8 悬空</text><text x="1075" y="372" class="lab">7 悬空</text><text x="1075" y="437" class="lab">6 ← +5 V</text><text x="1075" y="502" class="lab">5 → 输出</text>
<path d="M505 550 H625 V430 H675" class="signal"/><path d="M675 365 H650 V650 M675 495 H650" class="ground"/><path d="M615 650 H685 M625 665 H675 M638 680 H662" class="ground"/><text x="695" y="666" class="lab">GND</text>
<path d="M1065 430 H1105 V255 H1080" class="vcc"/><text x="1085" y="242" class="lab" fill="#c52d2f">+5 V</text><path d="M1105 300 H1130 V350" class="vcc"/><line x1="1100" y1="350" x2="1160" y2="350" class="wire"/><line x1="1100" y1="372" x2="1160" y2="372" class="wire"/><path d="M1130 372 V650" class="ground"/><path d="M1095 650 H1165 M1105 665 H1155 M1118 680 H1142" class="ground"/><text x="1175" y="360" class="lab">C2：100 nF</text><text x="1175" y="390" class="small">6脚到GND去耦</text>
<rect x="1225" y="145" width="520" height="610" rx="15" fill="#fff8f2" stroke="#bd571b" stroke-width="3"/><text x="1255" y="190" class="head">③ 输出与扬声器</text><path d="M1065 495 H1270" class="wire"/><text x="1085" y="535" class="small">来自LM386 5脚</text><line x1="1270" y1="455" x2="1270" y2="535" class="wire"/><line x1="1300" y1="455" x2="1300" y2="535" class="wire"/><text x="1285" y="420" text-anchor="middle" class="lab">C3：330 µF电解</text><text x="1255" y="565" class="lab" fill="#c52d2f">＋</text><text x="1304" y="565" class="lab">－</text><text x="1285" y="595" text-anchor="middle" class="small">正极接5脚</text><path d="M1300 495 H1390" class="wire"/><circle cx="1490" cy="495" r="68" class="part"/><path d="M1422 465 L1490 425 V565 L1422 525 Z M1558 460 Q1615 495 1558 530 M1576 442 Q1650 495 1576 548" class="wire"/><text x="1490" y="600" text-anchor="middle" class="lab">扬声器</text><path d="M1490 563 V650" class="ground"/><path d="M1455 650 H1525 M1465 665 H1515 M1478 680 H1502" class="ground"/><text x="1535" y="666" class="lab">GND</text>
<rect x="55" y="810" width="1690" height="220" rx="15" class="hint"/><text x="85" y="855" class="head">上电顺序</text><text x="85" y="895" class="lab">1．确认330 µF正极接5脚、LM386方向正确。  2．先测6脚对GND约为+5 V。  3．示波器先测P90应有0～3.3 V方波。</text><text x="85" y="937" class="lab">4．P1先调到最小音量；按传感器后缓慢增大音量。  5．无声先查：公共GND、6脚+5 V、C3极性、扬声器接线。</text><text x="85" y="980" class="lab" font-weight="bold">不要接：P90直连扬声器；1脚/8脚电容；7脚电容（本次验收均不需要）。</text>
</svg>

