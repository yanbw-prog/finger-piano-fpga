<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1780" viewBox="0 0 2500 1780">
  <defs>
    <style>
      text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#142033}.title{font-size:38px;font-weight:700}.subtitle{font-size:23px}.section{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:18px}.tiny{font-size:16px}.wire{stroke:#273444;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}.analog{stroke:#2469a5;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.logic{stroke:#157a51;stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:round}.audio{stroke:#c23b34;stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:round}.power{stroke:#d57b1f;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.box{fill:#fff;stroke:#273444;stroke-width:3}.panel{fill:#f8fbff;stroke:#7da7c9;stroke-width:3}.fpga{fill:#f1faf4;stroke:#157a51;stroke-width:4}.amp{fill:#fff8f4;stroke:#c26a35;stroke-width:4}.note{fill:#fff9df;stroke:#c4981d;stroke-width:3}.node{fill:#2469a5}.gnd{stroke:#273444;stroke-width:3;fill:none}.op{fill:#fff;stroke:#2469a5;stroke-width:3}.res{fill:#fff;stroke:#273444;stroke-width:3}
    </style>
    <g id="ground"><path d="M0 0v10m-18 0h36m-12 8h24m-7 8h10" class="gnd"/></g>
    <g id="cap"><line x1="0" y1="-20" x2="0" y2="-4" class="wire"/><line x1="-17" y1="-4" x2="17" y2="-4" class="wire"/><line x1="-17" y1="10" x2="17" y2="10" class="wire"/><line x1="0" y1="10" x2="0" y2="25" class="wire"/></g>
    <g id="channel">
      <rect x="0" y="0" width="1110" height="430" rx="16" class="panel"/>
      <text x="26" y="38" class="section">单路压力传感器信号调理电路（该结构复制三路）</text>
      <!-- FSR divider / sampling -->
      <text x="40" y="79" class="label">传感器采样与偏置</text>
      <path d="M105 98v20" class="power"/><text x="75" y="94" class="small">+5 V</text>
      <rect x="76" y="118" width="58" height="42" rx="3" class="res"/><text x="86" y="145" class="tiny">R6</text><text x="143" y="145" class="tiny">4.7kΩ</text>
      <path d="M105 160v42" class="analog"/><circle cx="105" cy="202" r="5" class="node"/><text x="121" y="196" class="small">采样节点 V<tspan baseline-shift="sub">S</tspan></text>
      <path d="M105 202v18" class="wire"/><rect x="76" y="220" width="58" height="42" rx="3" class="res"/><text x="86" y="247" class="tiny">R1</text><text x="143" y="247" class="tiny">330Ω</text><path d="M105 262v17" class="wire"/><use href="#ground" x="105" y="279"/>
      <path d="M105 202h92" class="analog"/><rect x="197" y="166" width="70" height="72" rx="3" class="res"/><text x="207" y="194" class="tiny">FSR</text><text x="203" y="216" class="tiny">R10</text><path d="M183 226l32-28m-14 2l14-2-2 14" class="wire"/><text x="278" y="193" class="tiny">压力传感器</text><text x="278" y="215" class="tiny">（实物器件）</text>
      <path d="M232 238v22" class="analog"/><rect x="203" y="260" width="58" height="42" rx="3" class="res"/><text x="212" y="287" class="tiny">R11</text><text x="270" y="287" class="tiny">3.3MΩ</text><path d="M232 302v17" class="wire"/><use href="#ground" x="232" y="319"/>
      <!-- follower U1A -->
      <path d="M232 238h76" class="analog"/><polygon points="308,178 308,288 458,233" class="op"/><text x="346" y="224" class="label">U1A</text><text x="340" y="248" class="small">TL084</text><text x="314" y="213" class="tiny">＋</text><text x="314" y="264" class="tiny">－</text><text x="452" y="226" class="tiny">1</text>
      <path d="M458 233h38" class="analog"/><path d="M496 233v70h-188v-39" class="analog"/><text x="335" y="326" class="tiny">电压跟随器（U1A）</text>
      <!-- reference follower U3B -->
      <text x="520" y="79" class="label">参考电压与跟随</text>
      <path d="M567 98v20" class="power"/><text x="537" y="94" class="small">+5 V</text><rect x="538" y="118" width="58" height="42" rx="3" class="res"/><text x="548" y="145" class="tiny">R3</text><text x="603" y="145" class="tiny">4.7kΩ</text><path d="M567 160v42" class="analog"/><circle cx="567" cy="202" r="5" class="node"/><text x="578" y="196" class="tiny">Vref</text><path d="M567 202v18" class="wire"/><rect x="538" y="220" width="58" height="42" rx="3" class="res"/><text x="548" y="247" class="tiny">R4</text><text x="603" y="247" class="tiny">330Ω</text><path d="M567 262v17" class="wire"/><use href="#ground" x="567" y="279"/>
      <path d="M567 202h63" class="analog"/><polygon points="630,158 630,268 780,213" class="op"/><text x="666" y="204" class="label">U3B</text><text x="662" y="228" class="small">TL084</text><text x="636" y="193" class="tiny">＋</text><text x="636" y="244" class="tiny">－</text><path d="M780 213h38" class="analog"/><path d="M818 213v70h-188v-39" class="analog"/><text x="659" y="306" class="tiny">参考电压跟随器（U3B）</text>
      <!-- difference amplifier -->
      <text x="850" y="79" class="label">差分、滤波输出</text>
      <path d="M496 233h34v-26h55" class="analog"/><rect x="585" y="182" width="58" height="42" rx="3" class="res"/><text x="595" y="209" class="tiny">R7</text><text x="650" y="209" class="tiny">2kΩ</text><path d="M643 203h56" class="analog"/>
      <path d="M818 213h35v60h38" class="analog"/><rect x="891" y="252" width="58" height="42" rx="3" class="res"/><text x="901" y="279" class="tiny">R8</text><text x="956" y="279" class="tiny">2kΩ</text><path d="M949 273h34" class="analog"/>
      <polygon points="983,169 983,309 1082,239" class="op"/><text x="1002" y="230" class="label">U2D</text><text x="1000" y="253" class="tiny">TL084</text><text x="989" y="208" class="tiny">－</text><text x="989" y="274" class="tiny">＋</text>
      <path d="M1082 239h21" class="analog"/><path d="M1103 239v-87h-305" class="analog"/><rect x="805" y="131" width="58" height="42" rx="3" class="res"/><text x="815" y="158" class="tiny">R2</text><text x="870" y="158" class="tiny">15kΩ</text><rect x="895" y="131" width="58" height="42" rx="3" class="res"/><text x="901" y="158" class="tiny">R12</text><text x="956" y="158" class="tiny">3kΩ</text>
      <path d="M983 273v63" class="analog"/><rect x="954" y="336" width="58" height="42" rx="3" class="res"/><text x="964" y="363" class="tiny">R9</text><text x="1019" y="363" class="tiny">15kΩ</text><path d="M983 378v12" class="wire"/><rect x="954" y="390" width="58" height="30" rx="3" class="res"/><text x="960" y="411" class="tiny">R13 3kΩ</text>
    </g>
  </defs>

  <rect width="2500" height="1780" fill="white"/>
  <text x="1250" y="55" text-anchor="middle" class="title">三路 FSR 手指钢琴系统总电路图</text>
  <text x="1250" y="88" text-anchor="middle" class="subtitle">三路同构 TL084 信号调理 → XC3S50AN FPGA（RTL）→ P90 音频功放 → 扬声器</text>

  <!-- three channel copies -->
  <g transform="translate(35,125)"><use href="#channel"/><rect x="18" y="52" width="240" height="38" rx="8" fill="#dff1ff" stroke="#2469a5" stroke-width="2"/><text x="34" y="79" class="label">通道 1：FSR1 → P76</text><text x="850" y="410" class="small">输出：R5=4.7kΩ，C1=100nF</text><path d="M1103 239h30" class="analog"/><rect x="1133" y="214" width="58" height="42" rx="3" class="res"/><text x="1141" y="241" class="tiny">R5</text><text x="1200" y="241" class="tiny">4.7kΩ</text><path d="M1191 235h55" class="analog"/><circle cx="1246" cy="235" r="5" class="node"/><path d="M1246 235v40" class="wire"/><use href="#cap" x="1246" y="295"/><path d="M1246 320v12" class="wire"/><use href="#ground" x="1246" y="332"/><path d="M1246 235h110" class="logic"/><text x="1265" y="222" class="label">OUT1（0/3.3 V）</text></g>
  <g transform="translate(35,615)"><use href="#channel"/><rect x="18" y="52" width="240" height="38" rx="8" fill="#dff1ff" stroke="#2469a5" stroke-width="2"/><text x="34" y="79" class="label">通道 2：FSR2 → P77</text><text x="850" y="410" class="small">输出：R5=4.7kΩ，C1=100nF</text><path d="M1103 239h30" class="analog"/><rect x="1133" y="214" width="58" height="42" rx="3" class="res"/><text x="1141" y="241" class="tiny">R5</text><text x="1200" y="241" class="tiny">4.7kΩ</text><path d="M1191 235h55" class="analog"/><circle cx="1246" cy="235" r="5" class="node"/><path d="M1246 235v40" class="wire"/><use href="#cap" x="1246" y="295"/><path d="M1246 320v12" class="wire"/><use href="#ground" x="1246" y="332"/><path d="M1246 235h110" class="logic"/><text x="1265" y="222" class="label">OUT2（0/3.3 V）</text></g>
  <g transform="translate(35,1105)"><use href="#channel"/><rect x="18" y="52" width="240" height="38" rx="8" fill="#dff1ff" stroke="#2469a5" stroke-width="2"/><text x="34" y="79" class="label">通道 3：FSR3 → P78</text><text x="850" y="410" class="small">输出：R5=4.7kΩ，C1=100nF</text><path d="M1103 239h30" class="analog"/><rect x="1133" y="214" width="58" height="42" rx="3" class="res"/><text x="1141" y="241" class="tiny">R5</text><text x="1200" y="241" class="tiny">4.7kΩ</text><path d="M1191 235h55" class="analog"/><circle cx="1246" cy="235" r="5" class="node"/><path d="M1246 235v40" class="wire"/><use href="#cap" x="1246" y="295"/><path d="M1246 320v12" class="wire"/><use href="#ground" x="1246" y="332"/><path d="M1246 235h110" class="logic"/><text x="1265" y="222" class="label">OUT3（0/3.3 V）</text></g>

  <!-- FPGA -->
  <rect x="1430" y="190" width="455" height="1200" rx="18" class="fpga"/>
  <text x="1657" y="240" text-anchor="middle" class="section">U4：XC3S50AN FPGA</text>
  <text x="1657" y="273" text-anchor="middle" class="small">器件：xc3s50an-5tqg144</text>
  <rect x="1475" y="325" width="365" height="370" rx="10" class="box"/>
  <text x="1657" y="370" text-anchor="middle" class="label">FPGA 内部 RTL 功能</text>
  <text x="1510" y="415" class="small">1．传感器状态采样</text><text x="1510" y="460" class="small">2．三位编码 → 音符查表</text><text x="1510" y="505" class="small">3．2 MHz 时钟分频</text><text x="1510" y="550" class="small">4．C4～B4 方波输出</text><text x="1510" y="595" class="small">5．111 状态：静音</text>
  <rect x="1475" y="755" width="365" height="185" rx="10" class="box"/>
  <text x="1657" y="795" text-anchor="middle" class="label">时钟与电源</text><text x="1510" y="838" class="small">P124 ← 2 MHz 晶振输出</text><text x="1510" y="880" class="small">P79 ← 3.3 V（按开发板接口）</text><text x="1510" y="922" class="small">GND 与模拟/功放共地</text>
  <text x="1450" y="355" class="label">P76 ← OUT1</text><text x="1450" y="845" class="label">P77 ← OUT2</text><text x="1450" y="1335" class="label">P78 ← OUT3</text>
  <path d="M1390 360h40" class="logic"/><path d="M1390 850h40" class="logic"/><path d="M1390 1340h40v-110" class="logic"/>
  <path d="M1885 610h135" class="audio"/><text x="1908" y="595" class="label">P90（audio_out）</text>
  <!-- oscillator -->
  <rect x="1468" y="1015" width="235" height="75" rx="8" class="box"/><text x="1585" y="1045" text-anchor="middle" class="label">X1：2 MHz 晶振</text><text x="1585" y="1073" text-anchor="middle" class="small">输出接 P124</text><path d="M1703 1053h58v-73" class="logic"/>

  <!-- LM386 -->
  <rect x="2020" y="340" width="430" height="860" rx="18" class="amp"/>
  <text x="2235" y="390" text-anchor="middle" class="section">LM386 功放与扬声器</text>
  <text x="2050" y="435" class="label">P90 输出链路</text>
  <path d="M2020 610h70" class="audio"/><use href="#cap" x="2110" y="610"/><text x="2072" y="560" class="small">C2 100nF</text><path d="M2110 635h50" class="audio"/>
  <rect x="2160" y="565" width="85" height="130" class="box"/><text x="2172" y="608" class="label">P1</text><text x="2169" y="638" class="small">100kΩ</text><text x="2166" y="665" class="small">电位器</text><path d="M2160 635v-70" class="audio"/><path d="M2202 695v42" class="wire"/><use href="#ground" x="2202" y="737"/><path d="M2245 635h60" class="audio"/><text x="2150" y="755" class="tiny">中间脚 → 3脚；另一外脚 → GND</text>
  <rect x="2305" y="535" width="105" height="265" rx="8" class="box"/><text x="2357" y="660" text-anchor="middle" class="section">LM386</text><text x="2318" y="578" class="tiny">3 输入</text><text x="2318" y="615" class="tiny">2 GND</text><text x="2318" y="752" class="tiny">4 GND</text><text x="2372" y="578" class="tiny">5 输出</text><text x="2372" y="615" class="tiny">6 +5V</text><text x="2372" y="752" class="tiny">1、7、8 悬空</text><path d="M2305 635h-60" class="audio"/><path d="M2305 675h-25v65" class="wire"/><use href="#ground" x="2280" y="740"/><path d="M2357 535v-52" class="power"/><text x="2370" y="482" class="small">+5 V</text><path d="M2357 483h45" class="power"/><use href="#cap" x="2402" y="502"/><path d="M2402 527v30" class="wire"/><use href="#ground" x="2402" y="557"/><text x="2410" y="493" class="tiny">100nF</text>
  <path d="M2410 635h22v180h-85" class="audio"/><use href="#cap" x="2347" y="835"/><text x="2290" y="875" class="small">C3 330µF</text><text x="2300" y="898" class="tiny">＋接 5脚</text><path d="M2347 860h-75" class="audio"/><polygon points="2272,825 2214,790 2214,895 2272,860" class="box"/><text x="2160" y="930" class="label">LS1 扬声器</text><path d="M2214 843h-55v55" class="wire"/><use href="#ground" x="2159" y="898"/>
  <rect x="2020" y="1250" width="430" height="250" rx="12" class="note"/>
  <text x="2050" y="1290" class="label">接线说明（必须共地）</text>
  <text x="2050" y="1330" class="small">① 三路 TL084：+5 V / −5 V 供电；</text>
  <text x="2050" y="1365" class="small">② FPGA 输入、P90 输出均为 0～3.3 V；</text>
  <text x="2050" y="1400" class="small">③ LM386 只用 +5 V 供电；</text>
  <text x="2050" y="1435" class="small">④ 传感器板、FPGA、LM386 的 GND 相连。</text>
  <text x="1250" y="1690" text-anchor="middle" class="subtitle">图：三路 FSR－TL084－FPGA－LM386 手指钢琴系统总电路图（P76、P77、P78 为三路传感器输入；P90 为音频输出）</text>
</svg>

